function goHome(){try{clearTimeout(ol.tmr)}catch(e){}if(ES){try{ES.close()}catch(e){}ES=null}R=null;ol={};g=null;L=null;start()}
async function hostGo(){
saveNames();var code=Math.random().toString(36).slice(2,6)+(cfg.teams==1?"1":"2");
R=await openRoom(code);if(!R)return;
ol={on:1,host:1,code:code,players:{},myTeam:0,av:0,playing:0,tm:cfg.teams==1?1:2};g=null;
R.on("join",function(m){var d=m.data||{};if(ol.banned&&ol.banned[m.peer]){R.emit("kick",{to:m.peer});return}if(!ol.players[m.peer]&&Object.keys(ol.players).length>=cfg.max-(ol.playing?1:0)){R.emit("full",{to:m.peer});return}ol.players[m.peer]={name:String(d.name||"لاعب").slice(0,14),team:d.team==1?1:0,av:+d.av||0};if(g&&g.S){if(g.dl&&(g.ph=="give"||g.ph=="guess"))g.S.rem=Math.max(0,g.dl-Date.now());R.emit("snap",g.S)}else lobby()});
R.on("hint",function(m){var d=m.data||{};if(!g||g.ph!="give"||m.peer!=g.gv)return;
var tg=arr(d.tg).filter(function(i){var c=g.cards[i];return c&&!c.trap});
if(!tg.length||!d.hint)return;tg.forEach(function(i){g.cards[i].tgt=1});g.hint=String(d.hint).slice(0,40);snap("guess")});
R.on("pick",function(m){var p=ol.players[m.peer];
if(!p||!g||g.ph!="guess"||m.peer==g.gv||(cfg.teams==2&&p.team!=g.gs))return;
var tr=null,any=0;
arr((m.data||{}).i).forEach(function(i){var c=g.cards[+i];if(!c||c.done)return;c.done=1;c.by=p.name;any=1;
var dl=c.tgt?1:c.trap?-1:0;c.st=c.tgt?"o":c.trap?"b":"g";if(dl){g.score[g.gs]+=dl;g.ps[m.peer]=(g.ps[m.peer]||0)+dl}if(c.trap)tr=c.w});
if(!any)return;
if(g.cards.every(function(c){return !c.tgt||c.done}))finOl(tr);else snap("guess",tr)});
R.on("go",function(m){if(g&&g.ph=="ann"&&m.peer==g.gv)snap("give")});
R.on("fin",function(m){var p=ol.players[m.peer];if(g&&g.ph=="guess"&&p&&m.peer!=g.gv&&(cfg.teams==1||p.team==g.gs))finOl()});
lobby()}
function joinScreen(code,pre){

view(LOGO+'<h1>لمحة</h1><div class="card" style="margin-top:14px"><label>اسمك</label><input id="jn" maxlength="14" value="'+esc(pre?pre.name:gname())+'">'+(ol.tm==1?"":'<label>فريقك</label><div class="seg"><button data-t="0" class="'+(ol.myTeam?"":"on")+'">الأول</button><button data-t="1" class="'+(ol.myTeam?"on":"")+'">الثاني</button></div>')+avs(ol.av)+'<button class="go" id="oljoin">ادخل</button></div>')}
async function joinGo(nm){
R=await openRoom(ol.code);if(!R)return;
ol.jd={name:nm,team:ol.myTeam,av:ol.av};
try{localStorage.setItem("lm_room",JSON.stringify({code:ol.code,name:nm,team:ol.myTeam,av:ol.av,tm:ol.tm}))}catch(e){}
R.on("snap",function(m){if(m.data)show(m.data)});R.on("kick",function(m){if(m.data&&m.data.to==ME){try{localStorage.removeItem("lm_room")}catch(e){}goHome();say("المضيف طردك من الغرفة")}});
R.on("full",function(m){if(m.data&&m.data.to==ME){goHome();say("الغرفة ممتلئة")}});R.emit("join",ol.jd);

function pickOn(t){t.parentNode.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b==t)})}
document.addEventListener("click",function(e){

if(id=="acout"){try{firebase.auth().signOut()}catch(er){}closePanel();say("تم تسجيل الخروج");return}

if(d.kick!=null){var kp=d.kick,kn=ol.players[kp]?ol.players[kp].name:"";ask("تطرد "+esc(kn)+" من الغرفة؟",function(){ol.banned=ol.banned||{};ol.banned[kp]=1;delete ol.players[kp];R.emit("kick",{to:kp});lobby()});return}
if(id=="gmlocal"){cfg.mode="local";setup();return}
if(id=="gmonline"){onl();return}

if(id=="gback"){if($("#gmake")||cfg.mode=="local")start();else onl();return}

if(id=="lcstart"){saveNames();lcStart();return}
if(id=="lcshow"){L.ph="give";lcTimer();lcDraw();return}
if(id=="lkb"){if(ol.code)copyText(roomUrl());return}
if(id=="olhost"){hostGo();return}
if(id=="olback"){var sv=saved();if(sv){joinScreen(sv.code,sv);joinGo(sv.name)}return}
if(d.k){saveNames();cfg[d.k]=isNaN(+d.v)?d.v:+d.v;setup();return}
if(id=="olcopy"){copyLink();return}
if(d.hp!=null){ol.hn=($("#hn")||{}).value||ol.hn;ol.playing=+d.hp;lobby();return}
if(d.t!=null){ol.myTeam=+d.t;if(ol.host)lobby();else pickOn(t);return}
if(d.a!=null){ol.av=+d.a;pickOn(t);return}
if(id=="olstart"){
if(ol.playing){var n=(($("#hn")||{}).value||"").trim();if(!n){say("اكتب اسمك");return}ol.players[ME]={name:n.slice(0,14),team:ol.myTeam,av:ol.av}}else delete ol.players[ME];
if(Object.keys(ol.players).length<2){say("لازم لاعبين على الأقل");return}
startGame();return}
if(id=="oljoin"){var nm=$("#jn").value.trim();if(!nm){say("اكتب اسمك أول");$("#jn").focus();return}joinGo(nm);return}
if(id=="olsend"){if(ol.local){lcHint();return}var h=$("#hint").value.trim();if(!h||!ol.sel.length){say("اكتب تلميح واختر كلمة");return}R.emit("hint",{hint:h,tg:ol.sel});say("انرسل التلميح");return}
if(id=="olyes"){if(ol.local){lcPick();return}if(!ol.pend.length){say("اختر كلمة أول");return}R.emit("pick",{i:ol.pend});ol.pend=[];say("انرسل اختيارك");draw(ol.S);return}

if(t.classList.contains("c")&&ol.S&&ol.ctx){var x=ol.S,i=+d.i,k;

});
